app = "voice-route-painter"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"        # traces.db + spend.json live on the volume below, so they survive deploys
  # TRUST_PROXY=1 is set as a secret (fly secrets list): rate limits read the visitor's IP from Fly-Client-IP

# One 1 GB volume, created once: fly volumes create route_data --region sin --size 1
# A volume belongs to one machine, which matches the app: limits and sessions are in memory, so run exactly one.
[mounts]
  source = "route_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
