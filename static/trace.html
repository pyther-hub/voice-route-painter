<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn Trace</title>
  <!-- Trace viewer: shows every span (agent run, LLM call, tool call) of one turn.
       Data comes from GET /api/trace/<id>; the id is in the page URL: trace.html?id=<trace id>.
       Plain HTML + JS, no libraries. -->
  <style>
    :root {
      --bg: #f6f5f3; --card: #fff; --border: #e6e4df; --text: #1a1a1a; --muted: #666;
      --blue: #2457d6; --blue-soft: #eef2fc;
      --agent: #1a1a1a; --llm: #2457d6; --tool: #1a7f4b; --err: #b42318;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px;
    }
    a { color: var(--blue); text-decoration: none; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; }
    .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }

    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 0 28px 28px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
    .label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

    /* left: turns of this session */
    .turns { padding: 16px 8px; align-self: start; position: sticky; top: 16px; }
    .turns .label { padding: 0 10px; }
    .turn { display: block; padding: 10px; border-radius: 8px; color: var(--text); }
    .turn:hover { background: #f6f6f4; }
    .turn.cur { background: var(--blue-soft); }
    .turn .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turn .r { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turn .e { color: var(--err); }

    /* right: summary + waterfall */
    .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .summary { padding: 20px; }
    .said { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .reply { margin: 0 0 14px; color: #333; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { background: #ebeae6; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-family: var(--mono); }
    .pill.err { background: #fde2e2; color: var(--err); }

    .spans { padding: 8px; }
    .row {
      display: grid; grid-template-columns: minmax(180px, 32%) 1fr 70px; gap: 12px; align-items: center;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
    }
    .row:hover { background: #f6f6f4; }
    .row.open { background: var(--blue-soft); }
    .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kind { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; color: #fff; flex: none; }
    .kind.agent { background: var(--agent); } .kind.llm { background: var(--llm); } .kind.tool { background: var(--tool); }
    .track { position: relative; height: 10px; background: #f1f1ed; border-radius: 5px; }
    .bar { position: absolute; top: 0; height: 100%; min-width: 3px; border-radius: 5px; }
    .bar.agent { background: #bbb; } .bar.llm { background: var(--llm); } .bar.tool { background: var(--tool); }
    .bar.err { background: var(--err); }
    .ms { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .row .errmark { color: var(--err); font-weight: 700; }

    .detail { margin: 0 10px 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .detail h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
    .detail pre {
      margin: 0; padding: 10px; background: #fafaf8; border-radius: 8px; font-family: var(--mono); font-size: 12px;
      white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto;
    }
    .detail .error { grid-column: 1 / -1; color: var(--err); font-family: var(--mono); font-size: 12px; }

    .empty { padding: 40px; text-align: center; color: var(--muted); }

    @media (max-width: 760px) {
      .top, .layout { padding-left: 16px; padding-right: 16px; }
      .layout { grid-template-columns: 1fr; }
      .turns { position: static; }
      .row { grid-template-columns: 1fr 60px; }
      .track { grid-column: 1 / -1; grid-row: 2; }
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>Trace</div>
    <a href="/">← Back to the map</a>
  </header>

  <div class="layout">
    <aside class="card turns">
      <p class="label">THIS SESSION</p>
      <div id="turns"></div>
    </aside>
    <main class="main" id="main">
      <div class="card empty">Loading…</div>
    </main>
  </div>

<script>
// Small helper: make an element with a class and text. textContent (not innerHTML) everywhere,
// because trace data contains what users typed and what the model wrote.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const pretty = v => v == null ? "—" : typeof v === "string" ? tryJson(v) : JSON.stringify(v, null, 2);
function tryJson(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }
const fmtMs = ms => ms >= 1000 ? `${(ms / 1000).toFixed(2)} s` : `${Math.round(ms)} ms`;

const params = new URLSearchParams(location.search);
const id = params.get("id") || "";
// The owner opens /trace.html?key=SECRET once: the key is kept in this browser and sent with every request.
let traceKey = "";
try {
  if (params.get("key")) localStorage.setItem("traceKey", params.get("key"));
  traceKey = localStorage.getItem("traceKey") || "";
} catch (e) {}

fetch(`/api/trace/${encodeURIComponent(id)}`, { headers: { "X-Trace-Key": traceKey } })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(show)
  .catch(err => {
    const main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(el("div", "card empty",
      err === 404 ? "No trace with this id. It is written when a turn finishes."
      : err === 401 ? "Trace key needed: open /trace.html?key=YOUR_TRACE_KEY once in this browser."
      : "Could not load the trace."));
  });

function show(data) {
  const spans = data.spans;
  const root = spans.find(s => !s.parent) || spans[0];
  document.title = `Trace · ${(root.input && root.input.text) || data.trace_id}`;

  // ---- left: other turns of the same session ----
  const turns = document.getElementById("turns");
  data.turns.forEach(t => {
    const a = el("a", "turn" + (t.trace_id === data.trace_id ? " cur" : ""));
    a.href = `trace.html?id=${t.trace_id}`;
    a.appendChild(el("div", "t", t.text || "(no text)"));
    a.appendChild(el("div", "r" + (t.error ? " e" : ""), t.error ? `error: ${t.error}` : (t.reply || "")));
    turns.appendChild(a);
  });
  if (!data.turns.length) turns.appendChild(el("div", "turn r", "No other turns"));

  // ---- right: summary card ----
  const main = document.getElementById("main");
  main.innerHTML = "";
  const sum = el("section", "card summary");
  const inp = root.input || {}, out = root.output || {};
  sum.appendChild(el("p", "label", "TURN"));
  sum.appendChild(el("p", "said", `“${inp.text || ""}”`));
  sum.appendChild(el("p", "reply", out.reply ? `→ ${out.reply}` : ""));
  const meta = el("div", "meta");
  const llmCalls = spans.filter(s => s.kind === "llm").length;
  const toolCalls = spans.filter(s => s.kind === "tool").length;
  [
    fmtMs(root.duration_ms),
    `${llmCalls} LLM call${llmCalls === 1 ? "" : "s"}`,
    `${toolCalls} tool call${toolCalls === 1 ? "" : "s"}`,
    out.tokens != null ? `${out.tokens} tokens` : null,
    inp.prompt_version, inp.model,
    out.stops ? `stops: ${out.stops.join(" → ") || "(empty)"}` : null,
  ].filter(Boolean).forEach(t => meta.appendChild(el("span", "pill", t)));
  if (root.error) meta.appendChild(el("span", "pill err", root.error));
  sum.appendChild(meta);
  main.appendChild(sum);

  // ---- right: waterfall. Each span is a bar placed by its start time and length. ----
  const t0 = root.started_at, total = Math.max(root.duration_ms, 1);
  const byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
  const depth = s => { let d = 0; while (s.parent && byId[s.parent]) { s = byId[s.parent]; d++; } return d; };
  // parent first, then its children in start order (spans are stored when they END, so sort here)
  const ordered = [];
  const visit = s => { ordered.push(s); spans.filter(c => c.parent === s.span_id).sort((a, b) => a.started_at - b.started_at).forEach(visit); };
  spans.filter(s => !s.parent || !byId[s.parent]).sort((a, b) => a.started_at - b.started_at).forEach(visit);

  const box = el("section", "card spans");
  box.appendChild(el("p", "label", "SPANS · click one to see its input and output")).style.padding = "8px 10px 0";
  ordered.forEach(s => {
    const row = el("div", "row");
    const name = el("div", "name");
    name.style.paddingLeft = `${depth(s) * 18}px`;
    name.appendChild(el("span", "kind " + s.kind, s.kind));
    name.appendChild(el("span", null, spanTitle(s)));
    if (s.error || (s.output && s.output.ok === false)) name.appendChild(el("span", "errmark", "!"));
    row.appendChild(name);

    const track = el("div", "track");
    const bar = el("div", `bar ${s.kind}${s.error ? " err" : ""}`);
    bar.style.left = `${Math.min(99, ((s.started_at - t0) * 1000) / total * 100)}%`;
    bar.style.width = `${Math.max(0.3, s.duration_ms / total * 100)}%`;
    track.appendChild(bar);
    row.appendChild(track);
    row.appendChild(el("div", "ms", fmtMs(s.duration_ms)));

    let detail = null;
    row.onclick = () => {
      if (detail) { detail.remove(); detail = null; row.classList.remove("open"); return; }
      detail = el("div", "detail");
      [["INPUT", s.input], ["OUTPUT", s.output]].forEach(([h, v]) => {
        const d = el("div");
        d.appendChild(el("h4", null, h));
        d.appendChild(el("pre", null, pretty(v)));
        detail.appendChild(d);
      });
      if (s.error) detail.appendChild(el("div", "error", s.error));
      row.after(detail);
      row.classList.add("open");
    };
    box.appendChild(row);
  });
  main.appendChild(box);
}

// A readable one-line title per span: "resolve_place  Agra", "llm step1  → resolve_place ×3"
function spanTitle(s) {
  if (s.kind === "tool") {
    let args = s.input;
    try { args = typeof args === "string" ? JSON.parse(args) : args; } catch {}
    const hint = args && ((args.names && args.names.join(", ")) || args.name || args.question || (args.place_ids && args.place_ids.join(" → ")));
    return hint ? `${s.name} · ${hint}` : s.name;
  }
  if (s.kind === "llm" && s.output) {
    const calls = s.output.calls || [];
    if (calls.length) {
      const names = {};
      calls.forEach(c => { const n = c.split("(")[0]; names[n] = (names[n] || 0) + 1; });
      return `${s.name} → ${Object.entries(names).map(([n, k]) => k > 1 ? `${n} ×${k}` : n).join(", ")}`;
    }
    return `${s.name} → text reply`;
  }
  return s.name;
}
</script>
</body>
</html>
